# Local REIM environment: PostgreSQL 16 + the read-only API.
#
#   docker compose up --build
#
# The API waits for PostgreSQL to become healthy, then applies migrations and
# seeds reference data before serving. Ingestion is NOT run automatically —
# trigger it explicitly:
#
#   docker compose exec api python -m reim.cli pipeline run-all
#
# Credentials below are local development defaults and are overridable through a
# .env file. Never reuse them outside a development machine.

name: reim

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-reim}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reim}
      POSTGRES_DB: ${POSTGRES_DB:-reim}
      # Deterministic collation so ORDER BY does not depend on the host locale.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-reim} -d ${POSTGRES_DB:-reim}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - reim

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      REIM_DATABASE_URL: >-
        postgresql+psycopg://${POSTGRES_USER:-reim}:${POSTGRES_PASSWORD:-reim}@postgres:5432/${POSTGRES_DB:-reim}
      REIM_ENVIRONMENT: ${REIM_ENVIRONMENT:-local}
      REIM_LOG_LEVEL: ${REIM_LOG_LEVEL:-INFO}
      REIM_LOG_JSON: ${REIM_LOG_JSON:-true}
      REIM_CORS_ALLOW_ORIGINS: ${REIM_CORS_ALLOW_ORIGINS:-*}
      REIM_DEFAULT_PAGE_SIZE: ${REIM_DEFAULT_PAGE_SIZE:-100}
      REIM_MAX_PAGE_SIZE: ${REIM_MAX_PAGE_SIZE:-1000}
    ports:
      - "${REIM_API_PORT:-8000}:8000"
    command: >-
      sh -c "alembic upgrade head
      && python -m reim.cli db seed
      && uvicorn apps.api.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - reim

volumes:
  postgres_data:
    driver: local

networks:
  reim:
    driver: bridge
