  # ------------------------------------------------------------------------
  # Guatemala — Banco de Guatemala
  #
  # Free SOAP service, no authentication, modern TLS. One request returns the
  # whole published history: 1990-01-01 onwards, ~1.3 MB. Verified 2026-08-09.
  # See docs/sources.md for the other five Central American central banks.
  # ------------------------------------------------------------------------
  - key: banguat_exchange_rate
    name: Guatemala official exchange rate (daily)
    description: >-
      Official GTQ/USD reference rates published daily by the Banco de
      Guatemala through its public SOAP service. Both sides of the pair are
      ingested: the bank buys and sells at different rates on 6,174 of the
      13,365 published days.
    country: GT
    organization: BANGUAT
    category: exchange_rate
    access_type: soap
    frequency: daily
    format: xml
    base_url: https://www.banguat.gob.gt/variables/ws/TipoCambio.asmx
    documentation_url: https://www.banguat.gob.gt/variables/ws/TipoCambio.asmx?WSDL
    connector: reim.ingestion.connectors.guatemala.banguat_exchange_rate
    indicators:
      - gt_exchange_rate_official_daily_buy
      - gt_exchange_rate_official_daily_sell
    license: public_official_data
    official: true
    enabled: true

  # ------------------------------------------------------------------------
  # Regional — Secretaría de Integración Económica Centroamericana
  #
  # REIM's first quarterly source and its first source with no country of its
  # own: one request returns all six. The host serves nothing to a client that
  # identifies itself honestly, so the User-Agent is declared below rather
  # than hidden in the connector. See docs/sources.md.
  # ------------------------------------------------------------------------
  - key: sieca_services_trade
    name: Central American trade in services (quarterly)
    description: >-
      Quarterly exports, imports and balance of services for the six Central
      American countries, from SIECA's regional compilation, covering
      2009-Q1 onwards. Services only; merchandise comes from the IMF.
    organization: SIECA
    category: external_sector
    access_type: http_api
    frequency: quarterly
    format: json
    base_url: https://www.servicios.sieca.int/ReporteGeneralServicios
    documentation_url: https://www.servicios.sieca.int/ReporteGeneralServicios
    connector: reim.ingestion.connectors.regional.sieca_services_trade
    indicators:
      - exports_services_quarterly
      - imports_services_quarterly
      - trade_balance_services_quarterly
    license: sieca_all_rights_reserved
    official: true
    enabled: true
    user_agent: >-
      Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko)
      Chrome/126.0 Safari/537.36
    user_agent_note: >-
      www.servicios.sieca.int answers REIM's own User-Agent with 202 and an
      empty body, and curl with 403; only a browser User-Agent receives data.
      The filter covers the whole host, including its static PDFs. No active
      control is defeated — this is a header check, not a challenge. Remove
      this override if SIECA opens the host to identified clients.

  # ------------------------------------------------------------------------
  # Regional — Comisión Económica para América Latina y el Caribe
  #
  # REIM's first GDP data and Belize's first data of any kind. One request
  # returns an indicator's whole matrix: every country, every year.
  #
  # The licence is the hard part and it is stated, not hidden: CEPAL's terms
  # expressly forbid redistribution and derivative works, which is stricter
  # than the IMF's terms or SIECA's absence of any grant. REIM ingests, carries
  # CEPAL's required citation on every observation, and documents the
  # exception. See docs/sources.md.
  #
  # These figures are CEPAL's own harmonised estimates, not the numbers each
  # national statistics office publishes.
  # ------------------------------------------------------------------------
  - key: cepalstat_gdp_annual
    name: Central American gross domestic product (annual)
    description: >-
      Annual GDP for the seven Central American countries from CEPALSTAT:
      totals at current and constant 2018 prices in US dollars, and the same
      pair per inhabitant, covering 1990 onwards. CEPAL's own harmonised
      estimates, built for cross-country comparability rather than to match
      each country's official national accounts.
    organization: CEPAL
    category: real_sector
    access_type: http_api
    frequency: annual
    format: json
    base_url: https://api-cepalstat.cepal.org/cepalstat/api/v1
    documentation_url: https://statistics.cepal.org/portal/cepalstat/
    connector: reim.ingestion.connectors.regional.cepalstat_gdp
    indicators:
      - gdp_current_usd_annual
      - gdp_constant_usd_annual
      - gdp_per_capita_current_usd_annual
      - gdp_per_capita_constant_usd_annual
    license: cepal_terms_of_use
    official: true
    enabled: false
    disabled_reason: >-
      Connector under construction; enabled once it has been run end to end
      against a real database.
