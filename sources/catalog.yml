  # ------------------------------------------------------------------------
  # Nicaragua — Instituto Nacional de Información de Desarrollo
  #
  # National primary source, monthly frequency. Each release ships the complete
  # historical series as a legacy .xls workbook, so one download covers
  # everything. File URLs are NOT derivable — naming drifts between releases —
  # so the connector discovers the newest workbook from the index page.
  # Verified reachable and parseable on 2026-08-04.
  # ------------------------------------------------------------------------
  - key: inide_cpi_monthly
    name: Nicaragua consumer price index (monthly)
    description: >-
      National consumer price index (base 2006=100) with month-on-month and
      year-on-year variation, published monthly by INIDE as an Excel workbook
      containing the full historical series from January 2007.
    country: NI
    organization: INIDE
    category: prices
    access_type: file_download
    frequency: monthly
    format: xls
    base_url: https://www.inide.gob.ni
    documentation_url: https://www.inide.gob.ni/Home/ipc
    connector: reim.ingestion.connectors.nicaragua.inide_cpi_monthly
    indicators:
      - ni_cpi_index_monthly
      - ni_cpi_inflation_monthly
      - ni_cpi_inflation_yoy
    license: public_official_data
    official: true
    enabled: true

  # ------------------------------------------------------------------------
  # Nicaragua — Banco Central de Nicaragua
  #
  # DISABLED. The service description is public and the connector is
  # implemented, but the endpoint could not be reached during development and
  # its response contract has never been observed. Enabling it without that
  # verification would mean shipping a connector whose parsing is a guess.
  # See docs/sources.md and the connector module docstring.
  # ------------------------------------------------------------------------
  - key: bcn_exchange_rate
    name: Nicaragua official exchange rate (daily)
    description: >-
      Official NIO/USD rate published daily by the Banco Central de Nicaragua
      through its public SOAP service, covering January 2012 onwards.
    country: NI
    organization: BCN
    category: exchange_rate
    access_type: soap
    frequency: daily
    format: xml
    base_url: https://servicios.bcn.gob.ni/Tc_Servicio/ServicioTC.asmx
    documentation_url: https://www.bcn.gob.ni/servicio-web-tipo-de-cambio
    connector: reim.ingestion.connectors.nicaragua.bcn_exchange_rate
    indicators:
      - ni_exchange_rate_official_daily
    license: public_official_data
    official: true
    enabled: false
    disabled_reason: >-
      The host only negotiates a pre-TLS 1.2 handshake, which OpenSSL 3.x
      rejects under a modern system crypto policy
      (error:0A000102:SSL routines::unsupported protocol). No live response was
      ever observed, so the SOAP response contract is unverified. Verify the
      WSDL and the *Result element shape from a host that can complete the
      handshake, record a fixture, then enable.
