  # ------------------------------------------------------------------------
  # Nicaragua — Instituto Nacional de Información de Desarrollo
  #
  # National primary source, monthly frequency. Each release ships the complete
  # historical series as a legacy .xls workbook, so one download covers
  # everything. File URLs are NOT derivable — naming drifts between releases —
  # so the connector discovers the newest workbook from the index page.
  # Verified reachable and parseable on 2026-08-04.
  # ------------------------------------------------------------------------
  - key: inide_cpi_monthly
    name: Nicaragua consumer price index (monthly)
    description: >-
      National, Managua and rest-of-country consumer price indices (base
      2006=100) with month-on-month and year-on-year variation, published
      monthly by INIDE as an Excel workbook containing the full historical
      series from January 2007.
    country: NI
    organization: INIDE
    category: prices
    access_type: file_download
    frequency: monthly
    format: xls
    base_url: https://www.inide.gob.ni
    documentation_url: https://www.inide.gob.ni/Home/ipc
    connector: reim.ingestion.connectors.nicaragua.inide_cpi_monthly
    indicators:
      - ni_cpi_index_monthly
      - ni_cpi_inflation_monthly
      - ni_cpi_inflation_yoy
      - ni_cpi_index_monthly_managua
      - ni_cpi_inflation_monthly_managua
      - ni_cpi_inflation_yoy_managua
      - ni_cpi_index_monthly_rest_of_country
      - ni_cpi_inflation_monthly_rest_of_country
      - ni_cpi_inflation_yoy_rest_of_country
    license: public_official_data
    official: true
    enabled: true

  # ------------------------------------------------------------------------
  # Nicaragua — Banco Central de Nicaragua
  #
  # REIM's first daily-frequency series, verified against the live WSDL and
  # the real RecuperaTC_Mes responses. Reaching the host needs a relaxed TLS
  # handshake, declared below. See docs/sources.md.
  # ------------------------------------------------------------------------
  - key: bcn_exchange_rate
    name: Nicaragua official exchange rate (daily)
    description: >-
      Official NIO/USD rate published daily by the Banco Central de Nicaragua
      through its public SOAP service, covering January 2012 onwards.
    country: NI
    organization: BCN
    category: exchange_rate
    access_type: soap
    frequency: daily
    format: xml
    base_url: https://servicios.bcn.gob.ni/Tc_Servicio/ServicioTC.asmx
    documentation_url: https://www.bcn.gob.ni/servicio-web-tipo-de-cambio
    connector: reim.ingestion.connectors.nicaragua.bcn_exchange_rate
    indicators:
      - ni_exchange_rate_official_daily
    license: public_official_data
    official: true
    enabled: true
    tls_profile: legacy
    tls_note: >-
      servicios.bcn.gob.ni negotiates TLS 1.0 only and signs its key exchange
      with SHA-1. REIM relaxes the protocol version and cipher security level
      for this host alone; certificate chain and hostname verification remain
      enforced. Remove this profile if the BCN modernises the endpoint.
    options:
      # Two requests per run. The 2012-onwards backfill is a one-off
      # start_month range, not something every scheduled run repeats.
      months_back: 2

  # ------------------------------------------------------------------------
  # Nicaragua — International Monetary Fund
  #
  # Monthly merchandise trade. Read from the IMF rather than the BCN because
  # www.bcn.gob.ni redirects automated requests to a bot-manager challenge.
  # NOTE: unlike every other source here, the IMF's data is NOT openly
  # licensed. See docs/sources.md.
  # ------------------------------------------------------------------------
  - key: imf_imts_nicaragua
    name: Nicaragua merchandise trade (monthly)
    description: >-
      Monthly merchandise exports FOB, imports CIF and the balance between
      them, from the IMF's International Merchandise Trade Statistics,
      world aggregate, covering January 1990 onwards.
    country: NI
    organization: IMF
    category: external_sector
    access_type: http_api
    frequency: monthly
    format: csv
    base_url: https://api.imf.org/external/sdmx/2.1
    documentation_url: https://www.imf.org/external/terms.htm
    connector: reim.ingestion.connectors.nicaragua.imf_imts_trade
    indicators:
      - exports_goods_monthly
      - imports_goods_monthly
      - trade_balance_goods_monthly
    license: imf_terms_of_use
    official: true
    enabled: true

