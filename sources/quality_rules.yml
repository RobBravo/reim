# Per-indicator data-quality rules.
#
# Validated by reim.domain.quality.rules.QualityRuleSet. Thresholds live here
# rather than in code so tuning them is a reviewable data change.
#
# Severity semantics enforced by the pipeline runner:
#   critical  aborts the load and rolls the transaction back
#   error     rejects the affected observation, the rest of the batch is written
#   warning   recorded, data still stored and marked passed_with_warnings
#   info      recorded only
#
# Bounds are deliberately wide: they are tripwires for a broken feed, not
# economic forecasts. A legitimate value must never be rejected because a
# threshold was set too tightly.

version: 1

defaults:
  max_future_days: 0
  min_observations: 1
  range_severity: error
  change_severity: warning
  freshness_severity: warning

indicators:
  # Exchange rate ---------------------------------------------------------
  ni_exchange_rate_official_daily:
    min_value: 1
    max_value: 1000
    allow_negative: false
    allow_zero: false
    # The córdoba was under a pre-announced crawling peg; a >5% daily move
    # would be a regime change worth a human look.
    max_period_change_pct: 5
    monotonic_increasing: false
    freshness_max_age_days: 7

  # Guatemala publishes both sides of its daily rate, and both are bounded by
  # sign only. The quetzal ran from 3.41332 in 1990 to 8.39482 at its peak, and
  # the 1990-91 liberalisation moved it sharply and genuinely — a ceiling or a
  # daily-change cap would reject real history, the same mistake `min_value: 1`
  # made against the córdoba below.
  gt_exchange_rate_official_daily_buy: &gt_daily_rate
    min_value: 0
    max_value: null
    allow_negative: false
    allow_zero: false
    max_period_change_pct: null
    monotonic_increasing: false
    # 13,364 days since 1990; a run that returns a handful is a broken window,
    # not a quiet source.
    min_observations: 1000
    freshness_max_age_days: 7

  gt_exchange_rate_official_daily_sell: *gt_daily_rate

  ni_exchange_rate_official_annual_avg:
    # NOT bounded below by 1. The World Bank restates the whole series in
    # current córdobas, so the 1979 and 1988/1991 redenominations push genuine
    # pre-1991 figures down to ~2e-9 NIO per USD. An earlier `min_value: 1`
    # wrongly rejected 31 real official observations; only the sign is
    # constrained now.
    min_value: 0
    max_value: 1000
    allow_negative: false
    allow_zero: false
    # Those same redenominations produce period-over-period jumps of several
    # thousand percent between 1987 and 1991. They are real, so this stays a
    # `warning`: the observations are stored and marked passed_with_warnings
    # rather than rejected.
    max_period_change_pct: 200
    # World Bank annual data for year Y appears during Y+1; allow ~2 years.
    freshness_max_age_days: 800

  # Prices ----------------------------------------------------------------
  ni_cpi_inflation_annual:
    # Deflation is real; hyperinflation upper bound is a sanity tripwire.
    min_value: -30
    max_value: 500
    allow_negative: true
    allow_zero: true
    max_period_change_pct: 1000
    freshness_max_age_days: 800

  # INIDE monthly CPI ------------------------------------------------------
  ni_cpi_index_monthly:
    min_value: 0
    allow_negative: false
    allow_zero: false
    # NOT monotonic_increasing: a CPI legitimately falls month to month
    # (May 2026 fell from 326.246 to 325.982).
    max_period_change_pct: 15
    # INIDE publishes month M during the first half of M+1; allow for the lag
    # plus a missed release before flagging staleness.
    freshness_max_age_days: 90
    # The published series runs from January 2007; a much shorter result means
    # the workbook was truncated or a column stopped parsing.
    min_observations: 100

  ni_cpi_inflation_monthly:
    min_value: -20
    max_value: 50
    allow_negative: true
    allow_zero: true
    # No max_period_change_pct: this series crosses zero, so a percentage change
    # OF it is unbounded and meaningless as a tripwire.
    freshness_max_age_days: 90
    min_observations: 100

  ni_cpi_inflation_yoy:
    min_value: -30
    max_value: 500
    allow_negative: true
    allow_zero: true
    freshness_max_age_days: 90
    min_observations: 100

  # Regional CPI. Thresholds are deliberately identical to the national
  # series above: a Managua index has the same plausible range as the
  # national one, and inventing tighter bounds "because it is a region"
  # is exactly how v0.1.0 rejected 31 legitimate exchange-rate figures.
  ni_cpi_index_monthly_managua:
    min_value: 0
    allow_negative: false
    allow_zero: false
    max_period_change_pct: 15
    freshness_max_age_days: 90
    min_observations: 100

  ni_cpi_inflation_monthly_managua:
    min_value: -20
    max_value: 50
    allow_negative: true
    allow_zero: true
    freshness_max_age_days: 90
    min_observations: 100

  ni_cpi_inflation_yoy_managua:
    min_value: -30
    max_value: 500
    allow_negative: true
    allow_zero: true
    freshness_max_age_days: 90
    min_observations: 100

  ni_cpi_index_monthly_rest_of_country:
    min_value: 0
    allow_negative: false
    allow_zero: false
    max_period_change_pct: 15
    freshness_max_age_days: 90
    min_observations: 100

  ni_cpi_inflation_monthly_rest_of_country:
    min_value: -20
    max_value: 50
    allow_negative: true
    allow_zero: true
    freshness_max_age_days: 90
    min_observations: 100

  ni_cpi_inflation_yoy_rest_of_country:
    min_value: -30
    max_value: 500
    allow_negative: true
    allow_zero: true
    freshness_max_age_days: 90
    min_observations: 100

  # External sector -------------------------------------------------------
  ni_remittances_received:
    min_value: 0
    max_value: 100000000000
    allow_negative: false
    allow_zero: false
    max_period_change_pct: 60
    freshness_max_age_days: 800

  ni_international_reserves:
    min_value: 0
    max_value: 100000000000
    allow_negative: false
    allow_zero: false
    max_period_change_pct: 80
    freshness_max_age_days: 800

  ni_exports_goods_services:
    min_value: 0
    max_value: 100000000000
    allow_negative: false
    allow_zero: false
    max_period_change_pct: 60
    freshness_max_age_days: 800

  ni_imports_goods_services:
    min_value: 0
    max_value: 100000000000
    allow_negative: false
    allow_zero: false
    max_period_change_pct: 60
    freshness_max_age_days: 800

  # Monthly merchandise trade (IMF IMTS). No max_period_change_pct on any of
  # the three: monthly trade is genuinely volatile, and the balance crosses
  # zero, which makes a percentage change OF it unbounded and meaningless —
  # the same reasoning already applied to ni_cpi_inflation_monthly.
  exports_goods_monthly:
    min_value: 0
    allow_negative: false
    allow_zero: false
    freshness_max_age_days: 120
    min_observations: 300

  imports_goods_monthly:
    min_value: 0
    allow_negative: false
    allow_zero: false
    freshness_max_age_days: 120
    min_observations: 300

  trade_balance_goods_monthly:
    # NOT bounded below. A trade balance crosses zero; a sign constraint here
    # would reject the great majority of real months in every country covered.
    allow_negative: true
    allow_zero: true
    freshness_max_age_days: 120
    min_observations: 300

  # Services trade -------------------------------------------------------
  # A quarterly source runs months behind by construction: 2026-Q1 was the
  # newest quarter available in August 2026, 131 days after it ended.
  exports_services_quarterly: &services_flow
    min_value: 0
    max_value: null
    allow_negative: false
    allow_zero: false
    max_period_change_pct: null
    monotonic_increasing: false
    freshness_max_age_days: 250
    # SIECA returns its complete history on every run: 69 quarters x 6
    # countries = 414 cells per flow. 400 leaves room for a quarter or two
    # of genuine gaps while still catching a run truncated to only the
    # newest quarter, which would otherwise pass every other SIECA check.
    min_observations: 400

  imports_services_quarterly: *services_flow

  trade_balance_services_quarterly:
    # 99 of 414 published quarters are deficits. Constraining the sign here
    # would reject a quarter of the real series.
    allow_negative: true
    allow_zero: true
    max_value: null
    max_period_change_pct: null
    monotonic_increasing: false
    freshness_max_age_days: 250
    # Same floor and the same reason as the two flows above: 414 is the real
    # per-indicator count, and a run returning far less should not pass.
    min_observations: 400

  # Gross domestic product ------------------------------------------------
  # CEPALSTAT returns each indicator's whole matrix on every run: 7 countries
  # x 36 years = 252 cells per indicator. 240 leaves room for a year of
  # genuine gap while still catching a run truncated to a handful of rows,
  # which would otherwise pass every other check here.
  #
  # The change ceiling is the tripwire for a scale mistake. The worst real
  # year-on-year move in these four series is 23.0% (Guatemala, 1991); a
  # forgotten or doubled 10^6 would show up as a jump of eight figures.
  gdp_current_usd_annual: &gdp_total
    min_value: 0
    max_value: null
    allow_negative: false
    allow_zero: false
    max_period_change_pct: 40
    monotonic_increasing: false
    # The newest period ends 2025-12-31, 230 days before this was written.
    # 600 tolerates CEPAL's annual publication cycle and still reports a
    # source that has frozen.
    freshness_max_age_days: 600
    min_observations: 240

  gdp_constant_usd_annual: *gdp_total

  # Same shape and same thresholds; the smallest real per-capita figure is
  # 704.39 USD, so the floor of zero is as far from the data as it is for the
  # totals.
  gdp_per_capita_current_usd_annual: &gdp_per_capita
    min_value: 0
    max_value: null
    allow_negative: false
    allow_zero: false
    max_period_change_pct: 40
    monotonic_increasing: false
    freshness_max_age_days: 600
    min_observations: 240

  gdp_per_capita_constant_usd_annual: *gdp_per_capita

  # Monetary aggregates -----------------------------------------------------
  # CEPALSTAT returns each indicator's whole matrix on every run. The real
  # monthly counts on 2026-08-19 are 2,026 / 1,611 / 1,746; the floors below
  # sit just under them, leaving room for a month of genuine gap while still
  # catching a run truncated to a handful of rows.
  #
  # The 60% ceiling is the tripwire for a scale mistake. The worst real
  # month-on-month move across the three series is 45.93% (Panama, November
  # 2006, M1 moving 1,984.6 -> 2,896.2 -> 2,610.3), which the source
  # publishes. A forgotten or doubled 10^6 would show up as eight figures.
  #
  # freshness_max_age_days is deliberately a threshold Honduras fails. On
  # 2026-08-19 the freshest country was 718 days behind and Honduras was
  # 1,023 (M1, M2) and 1,237 (M3). At 900 Honduras warns on all three from
  # the first run and the other six pass. Setting it at 1,300 would turn
  # every light green, which is tuning a threshold until it stops speaking:
  # Honduras really is three and a half years behind. This is `warning`
  # severity, so nothing is blocked.
  money_m1_monthly: &monetary_aggregate
    min_value: 0
    max_value: null
    allow_negative: false
    allow_zero: false
    max_period_change_pct: 60
    monotonic_increasing: false
    freshness_max_age_days: 900
    min_observations: 1950

  money_m2_monthly:
    <<: *monetary_aggregate
    min_observations: 1550

  money_m3_monthly:
    <<: *monetary_aggregate
    min_observations: 1680
