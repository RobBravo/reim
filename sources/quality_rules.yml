# Per-indicator data-quality rules.
#
# Validated by reim.domain.quality.rules.QualityRuleSet. Thresholds live here
# rather than in code so tuning them is a reviewable data change.
#
# Severity semantics enforced by the pipeline runner:
#   critical  aborts the load and rolls the transaction back
#   error     rejects the affected observation, the rest of the batch is written
#   warning   recorded, data still stored and marked passed_with_warnings
#   info      recorded only
#
# Bounds are deliberately wide: they are tripwires for a broken feed, not
# economic forecasts. A legitimate value must never be rejected because a
# threshold was set too tightly.

version: 1

defaults:
  max_future_days: 0
  min_observations: 1
  range_severity: error
  change_severity: warning
  freshness_severity: warning

indicators:
  # Exchange rate ---------------------------------------------------------
  ni_exchange_rate_official_daily:
    min_value: 1
    max_value: 1000
    allow_negative: false
    allow_zero: false
    # The córdoba was under a pre-announced crawling peg; a >5% daily move
    # would be a regime change worth a human look.
    max_period_change_pct: 5
    monotonic_increasing: false
    freshness_max_age_days: 7

  # Guatemala publishes both sides of its daily rate, and both are bounded by
  # sign only. The quetzal ran from 3.41332 in 1990 to 8.39482 at its peak, and
  # the 1990-91 liberalisation moved it sharply and genuinely — a ceiling or a
  # daily-change cap would reject real history, the same mistake `min_value: 1`
  # made against the córdoba below.
  gt_exchange_rate_official_daily_buy: &gt_daily_rate
    min_value: 0
    max_value: null
    allow_negative: false
    allow_zero: false
    max_period_change_pct: null
    monotonic_increasing: false
    # 13,364 days since 1990; a run that returns a handful is a broken window,
    # not a quiet source.
    min_observations: 1000
    freshness_max_age_days: 7

  gt_exchange_rate_official_daily_sell: *gt_daily_rate

  ni_exchange_rate_official_annual_avg:
    # NOT bounded below by 1. The World Bank restates the whole series in
    # current córdobas, so the 1979 and 1988/1991 redenominations push genuine
    # pre-1991 figures down to ~2e-9 NIO per USD. An earlier `min_value: 1`
    # wrongly rejected 31 real official observations; only the sign is
    # constrained now.
    min_value: 0
    max_value: 1000
    allow_negative: false
    allow_zero: false
    # Those same redenominations produce period-over-period jumps of several
    # thousand percent between 1987 and 1991. They are real, so this stays a
    # `warning`: the observations are stored and marked passed_with_warnings
    # rather than rejected.
    max_period_change_pct: 200
    # World Bank annual data for year Y appears during Y+1; allow ~2 years.
    freshness_max_age_days: 800

  # Prices ----------------------------------------------------------------
  ni_cpi_inflation_annual:
    # Deflation is real; hyperinflation upper bound is a sanity tripwire.
    min_value: -30
    max_value: 500
    allow_negative: true
    allow_zero: true
    max_period_change_pct: 1000
    freshness_max_age_days: 800

  # INIDE monthly CPI ------------------------------------------------------
  ni_cpi_index_monthly:
    min_value: 0
    allow_negative: false
    allow_zero: false
    # NOT monotonic_increasing: a CPI legitimately falls month to month
    # (May 2026 fell from 326.246 to 325.982).
    max_period_change_pct: 15
    # INIDE publishes month M during the first half of M+1; allow for the lag
    # plus a missed release before flagging staleness.
    freshness_max_age_days: 90
    # The published series runs from January 2007; a much shorter result means
    # the workbook was truncated or a column stopped parsing.
    min_observations: 100

  ni_cpi_inflation_monthly:
    min_value: -20
    max_value: 50
    allow_negative: true
    allow_zero: true
    # No max_period_change_pct: this series crosses zero, so a percentage change
    # OF it is unbounded and meaningless as a tripwire.
    freshness_max_age_days: 90
    min_observations: 100

  ni_cpi_inflation_yoy:
    min_value: -30
    max_value: 500
    allow_negative: true
    allow_zero: true
    freshness_max_age_days: 90
    min_observations: 100

  # Regional CPI. Thresholds are deliberately identical to the national
  # series above: a Managua index has the same plausible range as the
  # national one, and inventing tighter bounds "because it is a region"
  # is exactly how v0.1.0 rejected 31 legitimate exchange-rate figures.
  ni_cpi_index_monthly_managua:
    min_value: 0
    allow_negative: false
    allow_zero: false
    max_period_change_pct: 15
    freshness_max_age_days: 90
    min_observations: 100

  ni_cpi_inflation_monthly_managua:
    min_value: -20
    max_value: 50
    allow_negative: true
    allow_zero: true
    freshness_max_age_days: 90
    min_observations: 100

  ni_cpi_inflation_yoy_managua:
    min_value: -30
    max_value: 500
    allow_negative: true
    allow_zero: true
    freshness_max_age_days: 90
    min_observations: 100

  ni_cpi_index_monthly_rest_of_country:
    min_value: 0
    allow_negative: false
    allow_zero: false
    max_period_change_pct: 15
    freshness_max_age_days: 90
    min_observations: 100

  ni_cpi_inflation_monthly_rest_of_country:
    min_value: -20
    max_value: 50
    allow_negative: true
    allow_zero: true
    freshness_max_age_days: 90
    min_observations: 100

  ni_cpi_inflation_yoy_rest_of_country:
    min_value: -30
    max_value: 500
    allow_negative: true
    allow_zero: true
    freshness_max_age_days: 90
    min_observations: 100

  # External sector -------------------------------------------------------
  ni_remittances_received:
    min_value: 0
    max_value: 100000000000
    allow_negative: false
    allow_zero: false
    max_period_change_pct: 60
    freshness_max_age_days: 800

  ni_international_reserves:
    min_value: 0
    max_value: 100000000000
    allow_negative: false
    allow_zero: false
    max_period_change_pct: 80
    freshness_max_age_days: 800

  ni_exports_goods_services:
    min_value: 0
    max_value: 100000000000
    allow_negative: false
    allow_zero: false
    max_period_change_pct: 60
    freshness_max_age_days: 800

  ni_imports_goods_services:
    min_value: 0
    max_value: 100000000000
    allow_negative: false
    allow_zero: false
    max_period_change_pct: 60
    freshness_max_age_days: 800

  # Monthly merchandise trade (IMF IMTS). No max_period_change_pct on any of
  # the three: monthly trade is genuinely volatile, and the balance crosses
  # zero, which makes a percentage change OF it unbounded and meaningless —
  # the same reasoning already applied to ni_cpi_inflation_monthly.
  exports_goods_monthly:
    min_value: 0
    allow_negative: false
    allow_zero: false
    freshness_max_age_days: 120
    min_observations: 300

  imports_goods_monthly:
    min_value: 0
    allow_negative: false
    allow_zero: false
    freshness_max_age_days: 120
    min_observations: 300

  trade_balance_goods_monthly:
    # NOT bounded below. A trade balance crosses zero; a sign constraint here
    # would reject the great majority of real months in every country covered.
    allow_negative: true
    allow_zero: true
    freshness_max_age_days: 120
    min_observations: 300

  # Services trade -------------------------------------------------------
  # A quarterly source runs months behind by construction: 2026-Q1 was the
  # newest quarter available in August 2026, 131 days after it ended.
  exports_services_quarterly: &services_flow
    min_value: 0
    max_value: null
    allow_negative: false
    allow_zero: false
    max_period_change_pct: null
    monotonic_increasing: false
    freshness_max_age_days: 250
    # SIECA returns its complete history on every run: 69 quarters x 6
    # countries = 414 cells per flow. 400 leaves room for a quarter or two
    # of genuine gaps while still catching a run truncated to only the
    # newest quarter, which would otherwise pass every other SIECA check.
    min_observations: 400

  imports_services_quarterly: *services_flow

  trade_balance_services_quarterly:
    # 99 of 414 published quarters are deficits. Constraining the sign here
    # would reject a quarter of the real series.
    allow_negative: true
    allow_zero: true
    max_value: null
    max_period_change_pct: null
    monotonic_increasing: false
    freshness_max_age_days: 250
    # Same floor and the same reason as the two flows above: 414 is the real
    # per-indicator count, and a run returning far less should not pass.
    min_observations: 400

  # Gross domestic product ------------------------------------------------
  # CEPALSTAT returns each indicator's whole matrix on every run: 7 countries
  # x 36 years = 252 cells per indicator. 240 leaves room for a year of
  # genuine gap while still catching a run truncated to a handful of rows,
  # which would otherwise pass every other check here.
  #
  # The change ceiling is the tripwire for a scale mistake. The worst real
  # year-on-year move in these four series is 23.0% (Guatemala, 1991); a
  # forgotten or doubled 10^6 would show up as a jump of eight figures.
  gdp_current_usd_annual: &gdp_total
    min_value: 0
    max_value: null
    allow_negative: false
    allow_zero: false
    max_period_change_pct: 40
    monotonic_increasing: false
    # The newest period ends 2025-12-31, 230 days before this was written.
    # 600 tolerates CEPAL's annual publication cycle and still reports a
    # source that has frozen.
    freshness_max_age_days: 600
    min_observations: 240

  gdp_constant_usd_annual: *gdp_total

  # Same shape and same thresholds; the smallest real per-capita figure is
  # 704.39 USD, so the floor of zero is as far from the data as it is for the
  # totals.
  gdp_per_capita_current_usd_annual: &gdp_per_capita
    min_value: 0
    max_value: null
    allow_negative: false
    allow_zero: false
    max_period_change_pct: 40
    monotonic_increasing: false
    freshness_max_age_days: 600
    min_observations: 240

  gdp_per_capita_constant_usd_annual: *gdp_per_capita

  # Monetary aggregates -----------------------------------------------------
  # CEPALSTAT returns each indicator's whole matrix on every run. The real
  # monthly counts on 2026-08-19 are 2,026 / 1,611 / 1,746; the floors below
  # sit just under them, leaving room for a month of genuine gap while still
  # catching a run truncated to a handful of rows.
  #
  # The 60% ceiling is the tripwire for a scale mistake. The worst real
  # month-on-month move across the three series is 45.93% (Panama, November
  # 2006, M1 moving 1,984.6 -> 2,896.2 -> 2,610.3), which the source
  # publishes. A forgotten or doubled 10^6 would show up as eight figures.
  #
  # freshness_max_age_days is deliberately a threshold Honduras fails. On
  # 2026-08-19 the freshest country was 718 days behind and Honduras was
  # 1,023 (M1, M2) and 1,237 (M3). At 900 Honduras warns on all three from
  # the first run and the other six pass. Setting it at 1,300 would turn
  # every light green, which is tuning a threshold until it stops speaking:
  # Honduras really is three and a half years behind. This is `warning`
  # severity, so nothing is blocked.
  money_m1_monthly: &monetary_aggregate
    min_value: 0
    max_value: null
    allow_negative: false
    allow_zero: false
    max_period_change_pct: 60
    monotonic_increasing: false
    freshness_max_age_days: 900
    min_observations: 1950

  money_m2_monthly:
    <<: *monetary_aggregate
    min_observations: 1550

  money_m3_monthly:
    <<: *monetary_aggregate
    min_observations: 1680

  public_debt_usd_annual: &public_debt
    min_value: 0
    # The ratio reaches 222.1% of GDP in Nicaragua's early 1990s, so max_value
    # stays null here and below: a 100 cap would reject published figures.
    max_value: null
    allow_negative: false
    allow_zero: false
    # Nicaragua 1996 fell 47.8% on HIPC and Paris Club relief. 60 clears that
    # real event with headroom and still reports a discontinuity.
    max_period_change_pct: 60
    monotonic_increasing: false
    # The newest period ends 2025-12-31. 600 matches the GDP rules and CEPAL's
    # annual publication cycle.
    freshness_max_age_days: 600
    min_observations: 220

  public_debt_pct_gdp_annual:
    <<: *public_debt
    min_observations: 224

  exchange_rate_nominal_monthly:
    min_value: 0
    max_value: null
    allow_negative: false
    allow_zero: false
    # The largest real month-on-month move in the series is Nicaragua's 7.69%
    # in 2000-10. 25 clears that threefold and still reports a discontinuity.
    max_period_change_pct: 25
    monotonic_increasing: false
    # The series ends 2025-09 while CEPAL's own last_update is 2026-08: it
    # genuinely lags about a year, so the stalest country is ~341 days old as
    # of 2026-09-06. 450 passes that with headroom and still catches a series
    # that has stopped being extended.
    freshness_max_age_days: 450
    min_observations: 2700

  cpi_index_monthly:
    min_value: 0
    max_value: null
    allow_negative: false
    allow_zero: false
    # Deliberately null. Guatemala's 2010-01 splice is -42.6% and Nicaragua's
    # 1991-03 hyperinflation is +261%, both real and published. Any threshold
    # that tolerates the second detects nothing; any that catches the first
    # rejects real Nicaraguan history. `cepalstat_cpi_known_splices` does this
    # work instead, with the measured exceptions encoded rather than guessed.
    max_period_change_pct: null
    monotonic_increasing: false
    # The series ends 2026-07 and CEPAL updates it monthly; Belize, the
    # stalest, ends 2026-06. REIM's tightest freshness threshold, and it
    # should be — this is its freshest series.
    freshness_max_age_days: 120
    min_observations: 3400

  lending_rate_nominal_monthly:
    min_value: 0
    max_value: null
    allow_negative: false
    allow_zero: false
    # Nicaragua's largest real move is +45.1% in 2011-12 (9.09 -> 13.19).
    # 60 clears it and still reports a discontinuity. Kept only on this
    # series: see the two below for why it cannot work on them.
    max_period_change_pct: 60
    monotonic_increasing: false
    # The family ends 2025-10 worldwide while CEPAL's own last_update is
    # 2026-08: it genuinely lags about eleven months, so the stalest country
    # is 342 days old as of 2026-09-07. 450 matches the exchange-rate rule at
    # the identical lag, passes with headroom, and still catches a family that
    # has stopped being extended.
    freshness_max_age_days: 450
    min_observations: 2400

  deposit_rate_nominal_monthly:
    min_value: 0
    max_value: null
    allow_negative: false
    allow_zero: false
    # Deliberately null. This series sits near zero, where a percentage change
    # is unbounded and meaningless as a tripwire: Nicaragua moving 0.5 -> 1.7
    # is +240% and 1.2 points, and 79 moves exceed 25%, essentially all real.
    # `cepalstat_rates_step` measures percentage *points* instead. Same call
    # ni_cpi_inflation_monthly already makes.
    max_period_change_pct: null
    monotonic_increasing: false
    # Belize, Costa Rica and Honduras end 2025-08, the stalest in the family
    # at 372 days on 2026-09-07. 450 passes that with 78 days of headroom.
    freshness_max_age_days: 450
    min_observations: 2350

  policy_rate_monthly:
    min_value: 0
    max_value: null
    allow_negative: false
    # Nicaragua publishes a genuine 0 in 2010-03 and 2010-04, inside a real
    # attributed series. The other two rate series never publish a zero.
    allow_zero: true
    # Null for the same reason as the deposit rate: El Salvador moving
    # 1.47 -> 4.87 is +231% and 3.4 points, and 85 moves exceed 25%.
    max_period_change_pct: null
    monotonic_increasing: false
    freshness_max_age_days: 450
    # 1,621 measured across six countries; Nicaragua's 61 interior gaps could
    # widen, so this sits further below the measurement than its two siblings.
    min_observations: 1550

  bop_current_account_quarterly: &balance_of_payments
    min_value: null
    max_value: null
    # A balance of payments has no natural bound in either direction, and
    # 9,924 of 19,582 measured values are negative with 594 exactly zero:
    # a deficit is a negative number and an absent flow is a real zero.
    allow_negative: true
    allow_zero: true
    # Deliberately null on all twenty-five. These series cross zero, where a
    # percentage change is unbounded and meaningless as a tripwire — the same
    # call ni_cpi_inflation_monthly already makes.
    max_period_change_pct: null
    monotonic_increasing: false
    # Costa Rica, El Salvador, Honduras and Panama end 2026-Q1, 162 days old on
    # 2026-09-09; Belize, Guatemala and Nicaragua end 2025-Q4 at 252. 550
    # clears CEPAL's quarterly cycle with headroom and still catches a family
    # that has stopped being extended. It does not clear everything: Honduras
    # stops publishing current transfers (debit) at 2023-Q4, so that one series
    # warns at 984 days on every run. That is a truncated tail in CEPAL's cube,
    # reported rather than accommodated.
    freshness_max_age_days: 550
    # Per *indicator*, not per family. The 19,582 measured rows are spread
    # across the twenty-five series: 21 of them carry 784 country-quarters and
    # the four short ones carry 775 to 781. An earlier value of 19000 was the
    # family total in a per-series field, and it failed `dataset_not_empty` at
    # critical on all twenty-five, so the first live run stored nothing. 750
    # clears the smallest real series by 25 and still fires if any one country
    # disappears, which would cost 89 to 132 rows.
    min_observations: 750

  bop_capital_account_quarterly:
    <<: *balance_of_payments

  bop_financial_account_quarterly:
    <<: *balance_of_payments

  bop_errors_omissions_quarterly:
    <<: *balance_of_payments

  bop_global_balance_quarterly:
    <<: *balance_of_payments

  bop_reserves_related_quarterly:
    <<: *balance_of_payments

  bop_balance_goods_quarterly:
    <<: *balance_of_payments

  bop_balance_goods_services_quarterly:
    <<: *balance_of_payments

  bop_balance_income_quarterly:
    <<: *balance_of_payments

  bop_balance_current_transfers_quarterly:
    <<: *balance_of_payments

  bop_exports_goods_fob_quarterly:
    <<: *balance_of_payments

  bop_imports_goods_fob_quarterly:
    <<: *balance_of_payments

  bop_services_credit_quarterly:
    <<: *balance_of_payments

  bop_services_debit_quarterly:
    <<: *balance_of_payments

  bop_income_credit_quarterly:
    <<: *balance_of_payments

  bop_income_debit_quarterly:
    <<: *balance_of_payments

  bop_current_transfers_credit_quarterly:
    <<: *balance_of_payments

  bop_current_transfers_debit_quarterly:
    <<: *balance_of_payments

  bop_direct_investment_abroad_quarterly:
    <<: *balance_of_payments

  bop_direct_investment_inward_quarterly:
    <<: *balance_of_payments

  bop_portfolio_investment_assets_quarterly:
    <<: *balance_of_payments

  bop_portfolio_investment_liabilities_quarterly:
    <<: *balance_of_payments

  bop_other_investment_assets_quarterly:
    <<: *balance_of_payments

  bop_other_investment_liabilities_quarterly:
    <<: *balance_of_payments

  bop_reserve_assets_quarterly:
    <<: *balance_of_payments
